<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a09"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>点域 · 空间模型</title><meta name="description" content="探索农场、供水、温室、矿坑、储罐、港口、建筑柱阵、天文台、空间站与海上风电的十组三维粒子模型。"></head>
<body><a class="skip-link" href="#overview">跳到主要内容</a>
<header class="site-header"><a class="brand" href="#overview" aria-label="点域首页"><span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M5 23c5-11 10-11 15 0M12 23c4-7 9-8 15-1M6 27h21M19 8v7m-3-4 3-3 3 3"/></svg></span><span>点域</span></a><span class="header-note"><i aria-hidden="true"></i> 空间模型 · 10 个场景</span></header>
<main class="farm-site"><section class="hero" id="overview" aria-labelledby="hero-title">
  <div class="hero-copy"><div class="copy-heading"><p class="eyebrow"><span aria-hidden="true"></span> 01 / 丘陵之间的农场</p><div id="scene-glyph" class="scene-glyph" aria-hidden="true"></div></div><h1 id="hero-title"><span class="title-lead">顺着土地，</span><br><span class="title-line">看见<em>生长。</em></span></h1><p class="hero-description">沿着丘陵，探索梯田、果园与农舍。切换模型，查看农场的供水与温室状态。</p><div id="scene-metrics" class="scene-metrics" hidden></div><div class="hero-actions"><button class="primary-link" id="next-model">查看水塔 <span aria-hidden="true">↗</span></button></div></div>
  <div class="farm-viewer" id="explore" role="region" aria-label="探索三维农场">
  <div id="viewport" tabindex="0" aria-label="三维农场。拖拽旋转，滚轮或双指缩放；加减键缩放。" aria-describedby="hint"></div>
  <div class="topbar"><div class="viewer-label sr-only"><span class="status-dot" aria-hidden="true"></span><span id="scene-name">丘陵农场</span><small id="scene-number">TERRAIN / 01</small></div><button id="pure" class="icon-button" aria-label="隐藏界面" title="隐藏界面 · H"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
  <div id="scan-monitor" class="scan-monitor" hidden><span id="scan-stage">由上向下扫描</span><strong id="scan-percent">0%</strong><i><i id="scan-track"></i></i></div>
  <div id="asset-readings" class="asset-readings" aria-label="设施演示状态" hidden></div>
  <div class="bottom-ui"><p id="hint">拖拽探索<span>·</span>滚轮缩放</p><div class="toolbar" aria-label="模型探索控制"><div class="view-buttons" role="group" aria-label="选择观察区域"><button data-view="overview" aria-pressed="true">全景</button><button data-view="terrace" aria-pressed="false">梯田</button><button data-view="buildings" aria-pressed="false">农舍</button><button data-view="orchard" aria-pressed="false">果园</button></div><button id="rescan" hidden>重新扫描 <span aria-hidden="true">↻</span></button><span class="divider" aria-hidden="true"></span><button id="pause" class="icon-button" aria-label="暂停扫描" aria-pressed="false" title="暂停 · 空格"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="pause-icon" d="M9 6v12M15 6v12"/></svg></button><button id="settings-toggle" class="icon-button" aria-label="打开参数" aria-haspopup="dialog" aria-controls="settings" title="参数 · C"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M12 4v16M19 4v16M2 9h6M9 15h6M16 8h6"/></svg></button></div></div>
  <p id="scene-status" class="sr-only" role="status">当前场景：丘陵农场</p><p id="error" role="alert" hidden></p>
  </div></section>
<section class="model-navigation" aria-label="选择三维场景"><div class="model-buttons" role="group" aria-label="模型场景"><button data-scene="0" aria-pressed="true"><small>01</small><span>农场全景</span></button><button data-scene="1" aria-pressed="false"><small>02</small><span>水塔水量</span></button><button data-scene="2" aria-pressed="false"><small>03</small><span>大棚状态</span></button><button data-scene="3" aria-pressed="false"><small>04</small><span>矿坑</span></button><button data-scene="4" aria-pressed="false"><small>05</small><span>储罐</span></button><button data-scene="5" aria-pressed="false"><small>06</small><span>港口</span></button><button data-scene="6" aria-pressed="false"><small>07</small><span>柱阵</span></button><button data-scene="7" aria-pressed="false"><small>08</small><span>天文台</span></button><button data-scene="8" aria-pressed="false"><small>09</small><span>空间站</span></button><button data-scene="9" aria-pressed="false"><small>10</small><span>海上风电</span></button></div></section>
</main>
<dialog id="settings" aria-labelledby="settings-title"><div class="settings-head"><h2 id="settings-title">画面参数</h2><button id="close-settings" class="icon-button" aria-label="关闭参数"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <label class="range-label" for="speed">扫描速度<output id="speed-value" for="speed">0.32</output></label><input id="speed" type="range" min="0" max="1.2" step="0.01" value="0.32">
  <label class="range-label" for="size">粒子大小<output id="size-value" for="size">1.15</output></label><input id="size" type="range" min="0.5" max="3" step="0.05" value="1.15">
  <label class="range-label" for="trail">余辉<output id="trail-value" for="trail">0.85</output></label><input id="trail" type="range" min="0.1" max="2" step="0.05" value="0.85">
  <label class="select-label" for="palette">扫描配色<select id="palette"><option value="mint">薄荷青</option><option value="amber">暖橙</option><option value="violet">浅紫</option></select></label>
  <label class="check-label"><input id="rotate" type="checkbox" checked> 缓慢旋转</label><button id="reset" class="reset-button">恢复默认</button>
</dialog><script type="module" src="/src/main.js"></script></body></html>
